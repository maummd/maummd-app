name: 마음엠디 앱 빌드

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: 화면 만들기 (src → web/index.html → 앱)
        working-directory: .
        run: |
          npm ci
          node build.mjs
          mkdir -p android/app/src/main/assets
          cp web/index.html android/app/src/main/assets/index.html

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Android 16 SDK 설치
        run: |
          SDKM="$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin | sort -V | tail -1)/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-36" "build-tools;36.0.0" > /dev/null

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: 테스트용 APK 만들기
        run: gradle assembleDebug --no-daemon

      - name: 출시용 파일(AAB · APK) 만들기
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          VERSION_CODE: ${{ github.run_number }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            # 붙여 넣을 때 들어간 줄바꿈 · 공백 · 따옴표를 지우고 해독합니다.
            printf '%s' "$KEYSTORE_BASE64" | tr -d ' \r\n\t"' | base64 -d > "$RUNNER_TEMP/upload.jks" \
              || { echo "::error::KEYSTORE_BASE64 값이 올바르지 않습니다. github-secrets.txt의 긴 한 줄 전체를 다시 붙여 넣어 주세요."; exit 1; }
            keytool -list -keystore "$RUNNER_TEMP/upload.jks" -storepass "$KEYSTORE_PASSWORD" > /dev/null \
              || { echo "::error::서명 키 파일 또는 KEYSTORE_PASSWORD가 맞지 않습니다."; exit 1; }
            export KEYSTORE_PATH="$RUNNER_TEMP/upload.jks"
            # 키 이름(alias)은 키 파일에서 직접 읽고, PKCS12 키는 저장소 비밀번호와 키 비밀번호가 같습니다.
            KEY_ALIAS="$(keytool -list -v -keystore "$KEYSTORE_PATH" -storepass "$KEYSTORE_PASSWORD" | sed -n 's/^Alias name: //p' | head -1)"
            export KEY_ALIAS
            export KEY_PASSWORD="$KEYSTORE_PASSWORD"
            echo "서명 키로 서명합니다."
          else
            echo "서명 키가 없어 서명하지 않은 출시 파일을 만듭니다. (Play 업로드 불가)"
          fi
          gradle bundleRelease assembleRelease --no-daemon

      - name: 파일 이름 정리 (마음엠디)
        working-directory: ${{ github.workspace }}
        run: |
          mkdir -p out/test out/release
          cp android/app/build/outputs/apk/debug/*.apk out/test/maummd-test.apk
          cp android/app/build/outputs/bundle/release/*.aab out/release/maummd-release.aab
          cp android/app/build/outputs/apk/release/*.apk out/release/maummd-release.apk

      - uses: actions/upload-artifact@v4
        with:
          name: 마음엠디-테스트용-APK
          path: out/test/

      - uses: actions/upload-artifact@v4
        with:
          name: 마음엠디-출시용-AAB-APK
          path: out/release/
